name: pry_arr
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.1
  cloud_firestore: ^5.3.1
  firebase_storage: ^12.2.1
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.4
  provider: ^6.1.2
  go_router: ^14.3.0
  intl: ^0.20.3
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.14.0
  pdf: ^3.11.1
  printing: ^5.13.2
  path_provider: ^2.1.3
  sqflite: ^2.3.3
  uuid: ^4.4.0
  file_picker: ^8.0.5
  mailer: ^6.1.0
  http: ^1.2.2
  google_maps_flutter: ^2.9.0
  google_maps_flutter_android: ^2.21.0
  google_maps_flutter_platform_interface: ^2.17.0
  geolocator: ^13.0.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/icons/logo.png
    - assets/icons/badge.png
    - assets/icons/qr.jpeg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/logo.png"
  adaptive_icon_background: "#141414"
  adaptive_icon_foreground: "assets/icons/badge.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/logo.png"
    background_color: "#141414"
    theme_color: "#FF7A1A"

flutter_native_splash:
  color: "#141414"
  image: assets/icons/badge.png
  fullscreen: true
  android_12:
    color: "#141414"
    image: assets/icons/badge.png